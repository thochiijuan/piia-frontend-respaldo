services:
  frontend:
    restart: unless-stopped
    volumes:
      - ./react-javascript/develop/:/app
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=piia-platform"
      - "traefik.http.routers.climatologia-front.rule=Host(`${APP_HOST}`) || Host(`www.${APP_HOST}`)"
      - "traefik.http.routers.climatologia-front.entrypoints=websecure"
      - "traefik.http.routers.climatologia-front.tls=true"
      - "traefik.http.routers.climatologia-front.tls.certresolver=le"
      - "traefik.http.services.climatologia-front.loadbalancer.server.port=5173"
    command: sh -c "npm install --verbose && npm run dev && tail -f /dev/null"
    # command: tail -f /dev/null